name: CI

# The same gate as a local run: Linux with PoCL (OpenCL on the CPU) under GCC and Clang, where every test runs, and
# macOS, whose runners are virtual machines without an OpenCL device: there everything is built with warnings as
# errors and the tests that need no device run (DEVICE_TESTS below). The device tests on a real GPU are the local gate
# (CLAUDE.md "Build and CI"). The documentation is built on every run, warnings as errors, and published to GitHub
# Pages from main and from each release tag. Every leg blocks.

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86-64 GCC, PoCL
            os: ubuntu-24.04
            cxx: g++
          - name: Linux x86-64 Clang, PoCL
            os: ubuntu-24.04
            cxx: clang++
          - name: macOS ARM64 Apple Clang
            os: macos-latest
            cxx: c++
    env:
      # macOS runners have no OpenCL device: skip the tests that need one (the OpenCL tests, demo and benchmark, and
      # opencl.compile_programs, the fixture that builds the programs first; -FS keeps CTest from adding it back)
      DEVICE_TESTS: ${{ startsWith(matrix.os, 'macos') && '-E (GpuOpenCl|OpenCl/|opencl.compile_programs|demo.opencl|benchmark.opencl) -FS opencl_programs' || '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Build tools and OpenCL
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ninja-build ocl-icd-opencl-dev opencl-headers pocl-opencl-icd clinfo
            clinfo -l
          fi
          if [ "$RUNNER_OS" = macOS ]; then brew install ninja; fi

      - name: Static checks
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          python3 scripts/check_version.py
          python3 scripts/check_mirror.py

      - name: Release, warnings as errors
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} -DSNICHOLLS_GPU_WERROR=ON -DSNICHOLLS_GPU_BUILD_BENCHMARKS=ON
          cmake --build build
          ctest --test-dir build --output-on-failure $DEVICE_TESTS

      - name: Debug, asserts live
        run: |
          cmake -S . -B build-debug -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} -DSNICHOLLS_GPU_WERROR=ON
          cmake --build build-debug
          ctest --test-dir build-debug --output-on-failure $DEVICE_TESTS

  docs:
    name: Documentation (warnings are errors)
    runs-on: ubuntu-latest
    permissions:
      contents: write        # to publish to the gh-pages branch
    concurrency:
      group: pages           # main and a tag pushed together must not race on gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install Doxygen and the OpenCL headers
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends doxygen ocl-icd-opencl-dev opencl-headers

      - name: Configure
        run: cmake -B build -DSNICHOLLS_GPU_BUILD_TESTS=OFF -DSNICHOLLS_GPU_BUILD_DOCS=ON

      - name: Build the documentation
        run: cmake --build build --target docs

      # gh-pages holds generated HTML only, one folder per version; never edit it by hand.
      - name: Publish to GitHub Pages
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          DEST: ${{ github.ref_type == 'tag' && github.ref_name || 'main' }}
        run: |
          set -euo pipefail
          site="$RUNNER_TEMP/site"
          trap 'git worktree remove --force "$site" 2>/dev/null || true' EXIT
          git branch -D gh-pages 2>/dev/null || true
          if git fetch --depth 1 origin gh-pages 2>/dev/null; then
            git worktree add "$site" FETCH_HEAD
            git -C "$site" switch -C gh-pages
          else
            git worktree add --detach "$site"
            git -C "$site" switch --orphan gh-pages
          fi
          rm -rf "${site:?}/$DEST" && mkdir -p "$site/$DEST" && cp -R build/docs/html/. "$site/$DEST/"
          touch "$site/.nojekyll"
          latest=$(cd "$site" && ls -d v*/ 2>/dev/null | tr -d / | sort -V | tail -1 || true)
          target=${latest:-main}
          printf '<!DOCTYPE html>\n<meta charset="utf-8">\n<title>snicholls-gpu</title>\n<meta http-equiv="refresh" content="0; url=%s/">\n<p>The documentation for <a href="%s/">snicholls-gpu %s</a>; every version: %s</p>\n' \
            "$target" "$target" "$target" "$(cd "$site" && ls -d main v*/ 2>/dev/null | tr -d / | sort -V | sed 's|.*|<a href="&/">&</a>|' | paste -sd ' ' -)" > "$site/index.html"
          git -C "$site" add -A
          if git -C "$site" diff --cached --quiet; then echo "nothing to publish"; exit 0; fi
          git -C "$site" -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "docs: $DEST ($GITHUB_SHA)"
          git -C "$site" push origin gh-pages
