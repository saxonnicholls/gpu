name: CI

# The same gate as a local run: Linux with PoCL (OpenCL on the CPU) under GCC and Clang, where every test runs, and
# macOS, whose runners are virtual machines without an OpenCL device: there everything is built with warnings as
# errors and the tests that need no device run (DEVICE_TESTS below). The device tests on a real GPU are the local gate
# (CLAUDE.md "Build and CI"). Every leg blocks.

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86-64 GCC, PoCL
            os: ubuntu-24.04
            cxx: g++
          - name: Linux x86-64 Clang, PoCL
            os: ubuntu-24.04
            cxx: clang++
          - name: macOS ARM64 Apple Clang
            os: macos-latest
            cxx: c++
    env:
      # macOS runners have no OpenCL device: skip the tests that need one (the OpenCL tests, demo and benchmark)
      DEVICE_TESTS: ${{ startsWith(matrix.os, 'macos') && '-E (GpuOpenCl|OpenCl/|demo.opencl|benchmark.opencl)' || '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Build tools and OpenCL
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ninja-build ocl-icd-opencl-dev opencl-headers pocl-opencl-icd clinfo
            clinfo -l
          fi
          if [ "$RUNNER_OS" = macOS ]; then brew install ninja; fi

      - name: Static checks
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          python3 scripts/check_version.py
          python3 scripts/check_mirror.py

      - name: Release, warnings as errors
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} -DSNICHOLLS_GPU_WERROR=ON -DSNICHOLLS_GPU_BUILD_BENCHMARKS=ON
          cmake --build build
          ctest --test-dir build --output-on-failure $DEVICE_TESTS

      - name: Debug, asserts live
        run: |
          cmake -S . -B build-debug -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} -DSNICHOLLS_GPU_WERROR=ON
          cmake --build build-debug
          ctest --test-dir build-debug --output-on-failure $DEVICE_TESTS
